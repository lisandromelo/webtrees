server {
    listen 80;
    server_name _;
    root /var/www/webtrees;
    index index.php;
    client_max_body_size 64m;

    location ~ /\. {
        deny all;
    }

    location ^~ /data/        { deny all; }
    location ^~ /app/         { deny all; }
    location ^~ /vendor/      { deny all; }
    location ^~ /tests/       { deny all; }
    location ^~ /resources/   { deny all; }
    location ^~ /docker/      { deny all; }
    location ^~ /modules_v4/  { deny all; }
    location ^~ /node_modules/ { deny all; }

    location ~* ^/(composer\.(json|lock)|package(-lock)?\.json|webpack\.config\.js|phpunit\.xml\.dist|phpstan\.neon\.dist|phpcs\.xml\.dist)$ {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
    }

    location ~ \.php$ {
        deny all;
    }
}

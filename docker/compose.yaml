name: webtrees

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: webtrees-php:8.3
    restart: unless-stopped
    user: "1000:1000"
    volumes:
      - ..:/var/www/webtrees
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8093:80"
    volumes:
      - ..:/var/www/webtrees:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - internal

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD em docker/.env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-webtrees}
      MYSQL_USER: ${MYSQL_USER:-webtrees}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?defina MYSQL_PASSWORD em docker/.env}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - internal

networks:
  internal:
    name: webtrees-internal

volumes:
  dbdata:
    name: webtrees-dbdata
